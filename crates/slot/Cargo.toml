[package]
name = "slot"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "connector"
path = "src/main.rs"

[features]
default = ["host"]
host = ["dep:winit", "dep:cpal", "dep:gilrs", "slot-gfx/host"]
device = ["slot-gfx/device"]
test-support = []

[dependencies]
slot-gfx = { path = "../slot-gfx", default-features = false }
slot-input = { path = "../slot-input" }
slot-power = { path = "../slot-power" }
slot-retro = { path = "../slot-retro" }
slot-store = { path = "../slot-store" }
slot-ui = { path = "../slot-ui" }
winit = { workspace = true, optional = true }
cpal = { workspace = true, optional = true }
gilrs = { workspace = true, optional = true }
libloading = { workspace = true }
lz4_flex = { workspace = true }
png = { workspace = true }

[dev-dependencies]
slot = { path = ".", default-features = false, features = ["test-support"] }
slot-gfx = { path = "../slot-gfx", default-features = false, features = ["test-support"] }
tempfile = { workspace = true }
